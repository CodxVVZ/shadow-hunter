<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D0A12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Caçador de Sombras</title>
<style>
:root{--bg:#0d0a12;--fg:#e8e0f0;--ac:#c0203a;--pn:#1c1626}
@media (prefers-color-scheme:dark){:root{--bg:#0d0a12;--fg:#e8e0f0;--ac:#c0203a;--pn:#1c1626}}
:root[data-theme="dark"]{--bg:#0d0a12}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#sa{position:fixed;top:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,3,10,.78);padding:16px;box-sizing:border-box}
#ov.h{display:none}
.card{background:var(--pn);border:1px solid var(--ac);border-radius:14px;padding:20px;width:100%;max-width:380px;text-align:center}
h1{margin:0 0 8px;font-size:24px}p{margin:0 0 14px;opacity:.85;line-height:1.4}
.btn{display:block;width:100%;margin-top:10px;padding:14px;background:#2a1f38;border:1px solid var(--ac);color:var(--fg);border-radius:10px;font-size:16px;text-align:left}
.btn{display:flex;align-items:center;gap:12px}.btn.c{justify-content:center}.btn b{display:block}.ic{flex:none;width:58px;height:58px;display:flex;align-items:center;justify-content:center;background:#140f1c;border:1px solid #4a2a5a;border-radius:10px}.ic img{max-width:48px;max-height:48px}.btn small{opacity:.75}
.btn.c{text-align:center;font-weight:700;background:var(--ac)}

#mm,#cf{position:fixed;inset:0;z-index:5;display:flex;justify-content:center;background:#0D0A12}#cf{z-index:6}#mm.h,#cf.h{display:none}.ttl{font-family:'Press Start 2P',monospace;font-size:11px;color:#ffb3b4}
.mw{position:relative;width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;border-left:2px solid #5a4040;border-right:2px solid #5a4040;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-family:'Space Mono',monospace}
.mw:before{content:"";position:absolute;inset:0;z-index:30;pointer-events:none;opacity:.5;background:linear-gradient(rgba(18,16,26,0) 50%,rgba(0,0,0,.35) 50%);background-size:100% 4px}
.mw:after{content:"";position:absolute;inset:0;z-index:10;pointer-events:none;background:radial-gradient(circle at 50% 35%,rgba(85,21,201,.18),rgba(13,10,18,.9))}
.mh,.mf{position:relative;z-index:40;background:#100d15;display:flex;justify-content:space-between;align-items:center;padding:8px 14px}
.mh{border-bottom:2px solid #5a4040}.mf{border-top:2px solid #5a4040;font-size:10px;letter-spacing:.1em;color:#e3bebe;text-transform:uppercase}.mf b{color:#efc142}
.sb{background:#1d1a23;border:2px solid #5a4040;color:#ffb3b4;font-size:18px;padding:4px 8px;border-radius:0}
.coin{display:flex;gap:6px;align-items:center;background:#1d1a23;border:2px solid #efc142;padding:4px 10px;color:#efc142;font-weight:700;font-size:12px}
.mc{position:relative;z-index:20;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 16px;min-height:0}
.logo{font-family:'Press Start 2P',monospace;font-size:clamp(16px,5.6vw,24px);line-height:1.4;color:#c0203a;text-align:center;text-shadow:-2px -2px 0 #efc142,2px -2px 0 #efc142,-2px 2px 0 #efc142,2px 2px 0 #efc142,0 5px 0 #100d15}
.sub{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:10px;font-size:10px;letter-spacing:.1em;color:#cfbdff;font-weight:700}.sub i{height:2px;width:24px;background:#efc142}
.arch{position:relative;height:min(32vh,250px);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.glow{position:absolute;inset:0;border-radius:999px 999px 0 0;background:rgba(29,26,35,.85);border:2px solid rgba(85,21,201,.5);box-shadow:0 0 20px rgba(85,21,201,.3)}
.hero{position:relative;z-index:2;height:88%;filter:drop-shadow(0 10px 12px rgba(0,0,0,.85))}
.deco{position:absolute;z-index:3;image-rendering:pixelated;width:40px}#d1{top:12%;left:-6%}#d2{top:34%;right:-8%}
.btns{width:100%;display:flex;flex-direction:column;gap:8px}
.play{height:64px;background:#c0203a;color:#fff;border:0;border-radius:0;font-family:'Press Start 2P',monospace;font-size:18px;letter-spacing:.08em;box-shadow:0 -3px 0 #efc142,0 3px 0 #efc142,-3px 0 0 #efc142,3px 0 0 #efc142,0 6px 0 #100d15;display:flex;align-items:center;justify-content:center;gap:12px;margin:3px 3px 8px;width:calc(100% - 6px)}
.play:active{transform:translateY(4px)}.play span{color:#efc142}
.sec{height:56px;background:#1C1626;color:#cfbdff;border:2px solid rgba(207,189,255,.6);border-radius:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:.06em;box-shadow:0 4px 0 #100d15}
.sec:active{transform:translateY(3px)}.sec small{font-family:'Space Mono',monospace;font-size:10px;color:#e8ddff;background:#2c2831;padding:2px 8px;border:1px solid #5a4040}
.stats{width:100%;display:flex;justify-content:space-around;align-items:center;background:rgba(16,13,21,.9);border:2px solid rgba(85,21,201,.6);padding:8px;box-sizing:border-box}
.stats>div{display:flex;gap:8px;align-items:center;font-size:20px}.stats em{display:block;font-style:normal;font-size:10px;letter-spacing:.1em;color:rgba(207,189,255,.7);font-weight:700}.stats strong{font-size:18px;color:#e8e0ec}
.stats hr{width:2px;height:32px;border:0;background:#5a4040;margin:0}
.hint{font-size:10px;color:#e3bebe;opacity:.75;text-align:center;margin-top:6px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1C1626;border:2px solid #efc142;color:#efc142;padding:8px 14px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}#toast.on{opacity:1}
#gb{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 44px);width:40px;height:40px;z-index:4;background:rgba(16,13,21,.85);border:2px solid #5a4040;color:#ffb3b4;font-size:20px;border-radius:0;padding:0}
</style><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head><body>
<canvas id="c"></canvas><div id="sa"></div>
<div id="ov"><div class="card"><h1 id="t"></h1><p id="s"></p><div id="b"></div></div></div>
<div id="mm" class="h"><div class="mw">
<header class="mh"><button class="sb" data-soon>🔊</button><div class="coin">🪙 <span id="co">0</span></div></header>
<main class="mc">
<div><div class="logo">CAÇADOR<br>DE SOMBRAS</div><div class="sub"><i></i>NECRÓPOLE AMALDIÇOADA<i></i></div></div>
<div class="arch"><div class="glow"></div><img class="hero" id="hm" alt="Caçador"><img class="deco" id="d1" alt=""><img class="deco" id="d2" alt=""></div>
<div><div class="btns"><button class="play" id="play"><span>▶</span>JOGAR<span>▶</span></button>
<button class="sec" data-soon><span>⚔ PERSONAGENS</span><small>[1/8]</small></button>
<button class="sec" data-soon><span>⬆ MELHORIAS</span><small>★</small></button>
<button class="sec" id="cfg"><span>⚙ CONFIGURAÇÕES</span><small>≡</small></button></div>
<div class="stats" style="margin-top:10px"><div><span>⌛</span><span><em>MELHOR TEMPO</em><strong id="bt">0:00</strong></span></div><hr><div><span>💀</span><span><em>MAIS ABATES</em><strong id="bk">0</strong></span></div></div>
<div class="hint">Arraste na tela para mover · as armas atacam sozinhas</div></div>
</main>
<footer class="mf"><b>v0.1</b><span>Sobreviva 5 minutos</span></footer>
</div></div><div id="cf" class="h"><div class="mw">
<header class="mh"><button class="sb" id="cfb">◀</button><span class="ttl">CONFIGURAÇÕES</span><span style="width:40px"></span></header>
<main class="mc" style="justify-content:center;gap:16px"><div class="logo" style="font-size:28px">⚙</div><p style="margin:0;color:#e3bebe;font-size:12px;text-align:center;line-height:1.5">Em breve: som, controles e idioma.</p></main>
<div style="padding:12px 16px;position:relative;z-index:20"><button class="sec" id="cfx" style="display:none;justify-content:center;margin:0 3px 12px;width:calc(100% - 6px)"><span>SAIR DA PARTIDA</span></button><button class="play" id="cfv" style="font-size:14px">◀ VOLTAR</button></div>

function reset(){G={st:'play',t:0,kills:0,lv:1,xp:0,need:5,px:0,py:0,hp:100,mhp:100,spd:125,mag:60,hurt:0,face:1,dir:'f',mv:0,en:[],pr:[],gem:[],fx:[],tx:[],bl:[],w:{knife:1,axe:0,cross:0,orb:0,aura:0,bolt:0,spd:0,hp:0,mag:0,arm:0,pwr:0,cd:0,area:0,luck:0},cd:{knife:0,bolt:0,axe:0,cross:0},at:0,ang:0,sp:0,boss:0}}
const ov=document.getElementById('ov');
function show(t,s,bs){document.getElementById('t').textContent=t;document.getElementById('s').textContent=s;const b=document.getElementById('b');b.innerHTML='';bs.forEach(o=>{const e=document.createElement('button');e.className='btn'+(o.c?' c':'');e.innerHTML=o.h;e.onclick=()=>{ov.classList.add('h');o.f()};b.appendChild(e)});ov.classList.remove('h')}
const mnu=document.getElementById('mm');
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1400)}
function best(){try{return JSON.parse(localStorage.getItem('cs')||'{}')}catch(e){return{}}}
function saveRun(){try{const b=best();b.t=Math.max(b.t||0,Math.floor(G.t));b.k=Math.max(b.k||0,G.kills);b.c=(b.c||0)+G.kills;localStorage.setItem('cs',JSON.stringify(b))}catch(e){}}
function menu(){reset();G.st='menu';ov.classList.add('h');const b=best(),t=b.t||0;
document.getElementById('bt').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');document.getElementById('bk').textContent=b.k||0;document.getElementById('co').textContent=(b.c||0).toLocaleString('pt-BR');
document.getElementById('hm').src=A.menu_hero;document.getElementById('d1').src=A.bat0;document.getElementById('d2').src=A.ghost0;mnu.classList.remove('h')}
document.getElementById('play').onclick=()=>{mnu.classList.add('h');reset()};
document.querySelectorAll('[data-soon]').forEach(b=>b.onclick=()=>toast('Em breve!'));
const cfo=document.getElementById('cf');
let inGame=false;const gb=document.getElementById('gb'),cfx=document.getElementById('cfx');
document.getElementById('cfg').onclick=()=>{inGame=false;cfx.style.display='none';mnu.classList.add('h');cfo.classList.remove('h')};
gb.onclick=()=>{if(G.st!=='play')return;G.st='pause';inGame=true;cfx.style.display='flex';gb.style.display='none';cfo.classList.remove('h')};
document.getElementById('cfb').onclick=document.getElementById('cfv').onclick=()=>{cfo.classList.add('h');if(inGame){inGame=false;G.st='play'}else mnu.classList.remove('h')};
cfx.onclick=()=>{cfo.classList.add('h');inGame=false;saveRun();menu()};
function levelUp(){G.st='lvl';const pool=UP.filter(u=>G.w[u.k]<6);pool.sort(()=>Math.random()-.5);show('Nível '+G.lv+'!','Escolha uma melhoria:',pool.slice(0,3).map(u=>({h:`<span class="ic"><img src="${A['ic_'+u.k]}"></span><span><b>${u.n} ${G.w[u.k]?'(Nv '+G.w[u.k]+' → '+(G.w[u.k]+1)+')':'(novo)'}</b><small>${u.d}</small></span>`,f:()=>{G.w[u.k]++;if(u.k==='hp'){G.mhp+=25;G.hp=Math.min(G.mhp,G.hp+40)}if(u.k==='spd')G.spd*=1.12;if(u.k==='mag')G.mag+=40;G.st='play'}})))}
function win(){G.st='win';saveRun();show('Vitória! 🏆',`Você sobreviveu aos 5 minutos! ${G.kills} abates · Nível ${G.lv}`,[{h:'Jogar de novo',c:1,f:reset},{h:'Menu inicial',f:menu}])}
function over(){G.st='over';saveRun();const m=Math.floor(G.t/60),s=Math.floor(G.t%60);show('Fim de jogo',`Tempo ${m}:${String(s).padStart(2,'0')} · ${G.kills} abates · Nível ${G.lv}`,[{h:'Jogar de novo',c:1,f:reset},{h:'Menu inicial',f:menu}])}
/* ===== Entrada ===== */
cv.addEventListener('pointerdown',e=>{js={ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY,id:e.pointerId};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(js&&e.pointerId===js.id){js.x=e.clientX;js.y=e.clientY}});
const upf=e=>{if(js&&e.pointerId===js.id)js=null};
cv.addEventListener('pointerup',upf);cv.addEventListener('pointercancel',upf);
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
/* ===== Lógica ===== */
const CM=()=>1-.08*G.w.cd,AM=()=>1+.12*G.w.area;
function pstep(p,dt){if(p.t==='axe'){p.vy+=520*dt;p.a+=dt*12}else if(p.t==='cross'){p.age=(p.age||0)+dt;p.a+=dt*10;if(p.age>.65){if(!p.back){p.back=1;p.h=new Set()}const dx=G.px-p.x,dy=G.py-p.y,dd=Math.hypot(dx,dy)||1;p.vx=dx/dd*340;p.vy=dy/dd*340;if(dd<18)p.l=0}}}
function spawn(k){const t=G.t;if(!k){const p=['bat','slime'];if(t>25)p.push('skel');if(t>55)p.push('zomb');if(t>85)p.push('ghost');if(t>110)p.push('spid');k=p[Math.random()*p.length|0]}
const a=R(0,6.283),d=Math.hypot(W,H)/2+40,sc=k==='golem'?1+G.boss*.7:1+t/90;G.en.push({k,x:G.px+Math.cos(a)*d,y:G.py+Math.sin(a)*d,hp:ET[k].hp*sc,mh:ET[k].hp*sc,kx:0,ky:0,oh:0,f:Math.random()*2})}
function burst(x,y,c,n){for(let i=0;i<n;i++)G.fx.push({x,y,vx:R(-90,90),vy:R(-90,90),l:R(.25,.5),c})}
function hit(e,d,kx,ky){d*=1+.15*G.w.pwr;e.hp-=d;e.kx+=kx;e.ky+=ky;G.tx.push({x:e.x+R(-6,6),y:e.y-12,v:Math.round(d),l:.5});if(e.hp<=0&&!e.dead){e.dead=1;G.kills++;G.gem.push({x:e.x,y:e.y,v:ET[e.k].xp});if(Math.random()<.025)G.gem.push({x:e.x+10,y:e.y,v:.001,pot:1});burst(e.x,e.y,ET[e.k].boss?'#b060ff':'#8a8a7a',ET[e.k].boss?30:8)}}
function near(){let b=null,bd=420;for(const e of G.en){if(e.dead)continue;const d=Math.hypot(e.x-G.px,e.y-G.py);if(d<bd){bd=d;b=e}}return b}
function upd(dt){
G.t+=dt;G.ang+=dt*2.2;
let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
if(js){const dx=js.x-js.ox,dy=js.y-js.oy,m=Math.hypot(dx,dy);if(m>8){const k=Math.min(m,50)/50;ix=dx/m*k;iy=dy/m*k}}
const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m}
G.px+=ix*G.spd*dt;G.py+=iy*G.spd*dt;if(m>.1){G.dir=Math.abs(iy)>Math.abs(ix)*1.2?(iy<0?'b':'f'):'s';if(Math.abs(ix)>.1)G.face=ix>0?1:-1}G.mv=m>.1;G.hurt=Math.max(0,G.hurt-dt);
G.sp-=dt;if(G.sp<=0&&G.en.length<260){G.sp=Math.max(.1,.75-G.t*.0035);const n=1+(G.t/50|0);for(let i=0;i<n;i++)spawn()}
if(G.t>90+G.boss*120){G.boss++;spawn('golem')}
G.cd.knife-=dt;if(G.cd.knife<=0){const t=near();if(t){G.cd.knife=Math.max(.35,1.1-.1*G.w.knife)*CM();const a0=Math.atan2(t.y-G.py,t.x-G.px),n=G.w.knife;for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*.18;G.pr.push({x:G.px,y:G.py,vx:Math.cos(a)*340,vy:Math.sin(a)*340,a,l:1.3,d:7+2*G.w.knife,p:G.w.knife>=4?2:1,h:new Set()})}}else G.cd.knife=.1}
if(G.w.orb){const n=G.w.orb+1;for(let i=0;i<n;i++){const a=G.ang+i*6.283/n,ox=G.px+Math.cos(a)*70*AM(),oy=G.py+Math.sin(a)*70*AM();for(const e of G.en)if(!e.dead&&e.oh<=0&&Math.hypot(e.x-ox,e.y-oy)<ET[e.k].r+10){hit(e,6+2*G.w.orb,Math.cos(a)*150,Math.sin(a)*150);e.oh=.4}}}
if(G.w.aura){G.at-=dt;if(G.at<=0){G.at=.45;const r=(45+12*G.w.aura)*AM();for(const e of G.en)if(!e.dead&&Math.hypot(e.x-G.px,e.y-G.py)<r+ET[e.k].r)hit(e,4+2*G.w.aura,0,0)}}
if(G.w.bolt){G.cd.bolt-=dt;if(G.cd.bolt<=0){G.cd.bolt=Math.max(.7,2-.15*G.w.bolt)*CM();const c=G.en.filter(e=>!e.dead&&Math.hypot(e.x-G.px,e.y-G.py)<320);for(let i=0;i<G.w.bolt&&c.length;i++){const e=c.splice(Math.random()*c.length|0,1)[0];hit(e,22+6*G.w.bolt,0,0);G.bl.push({x:e.x,y:e.y,l:.25})}}}
G.cd.axe-=dt;if(G.w.axe&&G.cd.axe<=0){G.cd.axe=Math.max(.8,1.9-.15*G.w.axe)*CM();for(let i=0;i<1+(G.w.axe>2)+(G.w.axe>4);i++)G.pr.push({x:G.px,y:G.py,vx:R(-110,110),vy:-300,a:0,l:2.2,d:12+4*G.w.axe,p:99,h:new Set(),t:'axe'})}
G.cd.cross-=dt;if(G.w.cross&&G.cd.cross<=0){const t=near();if(t){G.cd.cross=Math.max(1,2.4-.2*G.w.cross)*CM();const n=Math.ceil(G.w.cross/2),a0=Math.atan2(t.y-G.py,t.x-G.px);for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*.4;G.pr.push({x:G.px,y:G.py,vx:Math.cos(a)*340,vy:Math.sin(a)*340,a:0,l:3,d:10+3*G.w.cross,p:99,h:new Set(),t:'cross'})}}else G.cd.cross=.1}
for(const p of G.pr){pstep(p,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;for(const e of G.en){if(e.dead||p.h.has(e))continue;if(Math.hypot(e.x-p.x,e.y-p.y)<ET[e.k].r+6){p.h.add(e);hit(e,p.d,p.vx*.3,p.vy*.3);if(--p.p<=0){p.l=0;break}}}}
G.pr=G.pr.filter(p=>p.l>0);
for(const e of G.en){const T=ET[e.k],dx=G.px-e.x,dy=G.py-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*T.sp*dt+e.kx*dt;e.y+=dy/d*T.sp*dt+e.ky*dt;e.kx*=.9;e.ky*=.9;e.oh-=dt;e.f+=dt*6;if(!e.dead&&d<T.r+10&&G.hurt<=0){G.hp-=Math.max(1,T.dm-2*G.w.arm);G.hurt=.5;burst(G.px,G.py,'#c0203a',6)}}
G.en=G.en.filter(e=>!e.dead);
for(const g of G.gem){const dx=G.px-g.x,dy=G.py-g.y,d=Math.hypot(dx,dy)||1;if(d<G.mag||g.m){g.m=1;g.x+=dx/d*280*dt;g.y+=dy/d*280*dt}if(d<14){if(g.pot)G.hp=Math.min(G.mhp,G.hp+25);else G.xp+=g.v*(1+.12*G.w.luck);g.v=0}}
G.gem=G.gem.filter(g=>g.v>0);
for(const f of G.fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=dt}G.fx=G.fx.filter(f=>f.l>0);
for(const t of G.tx){t.y-=30*dt;t.l-=dt}G.tx=G.tx.filter(t=>t.l>0);
for(const b of G.bl)b.l-=dt;G.bl=G.bl.filter(b=>b.l>0);
if(G.hp<=0){over();return}
if(G.t>=300){win();return}
if(G.xp>=G.need){G.xp-=G.need;G.lv++;G.need=Math.round(G.need*1.3+3);levelUp()}
}
/* ===== Desenho ===== */
function spr(c,x,y,s,flip){const w=c.width*s,hh=c.height*s;ctx.save();ctx.translate(Math.round(x),Math.round(y));if(flip)ctx.scale(-1,1);ctx.drawImage(c,-w/2,-hh/2,w,hh);ctx.restore()}
function shadow(x,y,w){ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,y,w,w*.35,0,0,6.283);ctx.fill()}
function ground(){const T=32,x0=Math.floor((G.px-W/2)/T)-1,x1=Math.ceil((G.px+W/2)/T)+1,y0=Math.floor((G.py-H/2)/T)-1,y1=Math.ceil((G.py+H/2)/T)+1;
for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const r=h(x,y);ctx.fillStyle=r<.07?'#211a13':r<.4?'#292712':r<.7?'#2b2914':'#272511';ctx.fillRect(x*T,y*T,T,T);if(r>.75){ctx.fillStyle='#3a3818';const o=r*977%1;ctx.fillRect(x*T+(o*24|0)+2,y*T+(r*53%20|0)+4,2,5);ctx.fillRect(x*T+(o*13|0)+14,y*T+(r*31%18|0)+6,2,4)}}
const C=170,cx0=Math.floor((G.px-W/2)/C)-1,cx1=Math.ceil((G.px+W/2)/C)+1,cy0=Math.floor((G.py-H/2)/C)-1,cy1=Math.ceil((G.py+H/2)/C)+1,PR=['tomb','treeA','treeB','pond','fence','tomb','treeA','rocks','skull','treeB'];
for(let cy=cy0;cy<=cy1;cy++)for(let cx=cx0;cx<=cx1;cx++){const r=h(cx+999,cy-777);if(r>.6)continue;const x=cx*C+h(cx,cy+5)*C,y=cy*C+h(cx+7,cy)*C,im=IM[PR[(r*100|0)%PR.length]];if(!im||!im.width)continue;if(im.height>100)shadow(x,y,im.width*.3);ctx.drawImage(im,Math.round(x-im.width/2),Math.round(y-im.height+10))}}
function draw(){
ctx.fillStyle='#0d0a12';ctx.fillRect(0,0,W,H);
ctx.save();ctx.translate(Math.round(W/2-G.px),Math.round(H/2-G.py));
ground();
for(const g of G.gem){const gi=IM[g.pot?'pot':g.v>=3?'gem2':g.v>=2?'gem1':'gem0'];ctx.drawImage(gi,Math.round(g.x-gi.width/2),Math.round(g.y-gi.height/2))}
if(G.w.aura){const r=(45+12*G.w.aura)*AM(),pl=.15+.05*Math.sin(G.t*6);ctx.fillStyle=`rgba(255,110,30,${pl})`;ctx.beginPath();ctx.arc(G.px,G.py,r,0,6.283);ctx.fill();ctx.strokeStyle='rgba(255,170,60,.6)';ctx.lineWidth=2;ctx.stroke()}
const fr=(G.t*9|0)%4;
const ds=[...G.en].sort((a,b)=>a.y-b.y);
for(const e of ds){const T=ET[e.k],c=T.spr[(e.f|0)%T.spr.length];shadow(e.x,e.y+c.height*T.s*.4,c.width*T.s*.3);spr(c,e.x,e.y+(e.k==='ghost'?Math.sin(e.f*.5)*4:0),T.s,e.x<G.px);
if(T.boss){ctx.fillStyle='#000';ctx.fillRect(e.x-30,e.y-90,60,6);ctx.fillStyle='#b060ff';ctx.fillRect(e.x-30,e.y-90,60*e.hp/e.mh,6)}}
shadow(G.px,G.py+24,16);
if(!(G.hurt>0&&(G.t*20|0)%2)){const hs=G.dir==='b'?HB:G.dir==='f'?HF:HS;spr(hs[G.mv?fr:0],G.px,G.py,1,G.dir==='s'&&G.face<0)};
for(const p of G.pr){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);const wi=IM['w_'+(p.t||'knife')];ctx.drawImage(wi,-wi.width/2,-wi.height/2);ctx.restore()}
if(G.w.orb){const n=G.w.orb+1;for(let i=0;i<n;i++){const a=G.ang+i*6.283/n,x=G.px+Math.cos(a)*70*AM(),y=G.py+Math.sin(a)*70*AM();ctx.fillStyle='#7a3cff';ctx.beginPath();ctx.arc(x,y,9,0,6.283);ctx.fill();ctx.fillStyle='#9fe8ff';ctx.beginPath();ctx.arc(x,y,4,0,6.283);ctx.fill()}}
for(const b of G.bl){ctx.strokeStyle='#bfe6ff';ctx.lineWidth=3;ctx.beginPath();let x=b.x,y=b.y-260;ctx.moveTo(x,y);while(y<b.y){y+=26;x=y>=b.y?b.x:b.x+R(-12,12);ctx.lineTo(x,y)}ctx.stroke()}
for(const f of G.fx){ctx.fillStyle=f.c;ctx.fillRect(f.x,f.y,4,4)}
ctx.font='bold 13px system-ui';ctx.textAlign='center';for(const t of G.tx){ctx.fillStyle='#fff';ctx.fillText(t.v,t.x,t.y)}
ctx.restore();
const gr=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(5,3,12,.6)');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
/* HUD */
const y0=SAT;ctx.fillStyle='#000b';ctx.fillRect(0,y0,W,10);ctx.fillStyle='#8a5cff';ctx.fillRect(0,y0,W*G.xp/G.need,10);
ctx.fillStyle='#000b';ctx.fillRect(10,y0+18,130,12);ctx.fillStyle='#d02848';ctx.fillRect(10,y0+18,130*Math.max(0,G.hp)/G.mhp,12);
ctx.font='bold 14px system-ui';ctx.fillStyle='#fff';ctx.textAlign='left';ctx.fillText('Nv '+G.lv,10,y0+48);
const rt=Math.max(0,Math.ceil(300-G.t)),m=Math.floor(rt/60),s=rt%60;ctx.textAlign='center';ctx.font='bold 20px system-ui';ctx.fillText(m+':'+String(s).padStart(2,'0'),W/2,y0+36);
ctx.textAlign='right';ctx.font='bold 14px system-ui';ctx.fillText('💀 '+G.kills,W-10,y0+32);
if(js){const dx=js.x-js.ox,dy=js.y-js.oy,mm=Math.min(Math.hypot(dx,dy),50),a=Math.atan2(dy,dx);ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(js.ox,js.oy,50,0,6.283);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(js.ox+Math.cos(a)*mm,js.oy+Math.sin(a)*mm,20,0,6.283);ctx.fill()}
}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(G.st==='play')upd(dt);draw();const vis=G.st==='play'?'block':'none';if(gb.style.display!==vis)gb.style.display=vis;requestAnimationFrame(loop)}
Promise.all(Object.keys(A).map(L)).then(()=>{prep();menu();requestAnimationFrame(loop)});
